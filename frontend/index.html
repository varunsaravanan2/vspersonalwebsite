<!doctype html>
<!--
  The single HTML page for the whole site. React renders every screen inside
  <div id="root">, and React Router swaps screens without reloading the page.
  That's what makes this a "single-page application" (SPA).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Varun Saravanan's portfolio, styled after the Super Smash Bros. Ultimate menus." />
    <title>Varun Saravanan · Portfolio</title>

    <!--
      Fonts from Google Fonts. preconnect opens the connection early so the
      fonts arrive sooner. display=swap shows fallback text right away instead
      of invisible text while the fonts download.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
